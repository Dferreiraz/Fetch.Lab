<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth motion-reduce:scroll-auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dragon Ball Z - Personagens</title>

  <!-- Tailwind CSS via Play CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: "#0d0d0d",
            soft: "#1e1e1e",
            card: "#222222",
            footer: "#111111",
            yellow: "#ffcc00",
            "yellow-bright": "#fff000",
            orange: "#ff6600",
            "orange-mid": "#ff9000",
            "orange-glow": "#ff9900",
            fg: "#ffffff",
            dim: "#cccccc"
          },
          fontFamily: {
            sans: ["Segoe UI", "sans-serif"]
          }
        }
      }
    };
  </script>

  <script src="./script.js" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-gradient-to-b from-dark to-soft font-sans text-[16px] leading-[1.6] text-fg antialiased">

  <header class="flex flex-col items-center gap-2 bg-gradient-to-r from-yellow to-orange px-4 py-8 text-center shadow-[0_4px_10px_rgba(0,0,0,0.4)]">
    <img class="h-auto w-full max-w-[350px] drop-shadow-[2px_4px_6px_rgba(0,0,0,0.3)]" src="./assets/img/Dragon_Ball_Z_logo.svg" alt="Logo Dragon Ball">
    <h1 class="text-[32px] font-bold leading-[1.15]">Explore os personagens lendários do universo DBZ</h1>
  </header>

  <main id="personagens-container" class="mx-auto my-12 grid w-full max-w-[1300px] flex-1 auto-rows-max grid-cols-2 gap-4 px-4 sm:gap-6 sm:px-6 lg:grid-cols-[repeat(auto-fit,minmax(250px,1fr))] lg:gap-8 lg:px-8">

  </main>

  <footer class="bg-footer px-4 py-8 text-center text-[0.9rem] text-[#777]">
    <p>Feito com Ki infinito por <span class="text-orange-glow">Davi</span> ⚡</p>
  </footer>

</body>
</html>
